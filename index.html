<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DRETAIN C STORE | 24/7 Python Bot Cloud</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #070913;
      --card: rgba(16, 21, 40, 0.75);
      --border: rgba(0, 240, 255, 0.22);
      --cyan: #00f0ff;
      --pink: #ff2a85;
      --green: #00ff88;
      --red: #ff3b5c;
      --text: #e6f1ff;
      --muted: #8892b0;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: radial-gradient(circle at 15% 15%, rgba(0, 240, 255, 0.12), transparent 35%),
                  radial-gradient(circle at 85% 85%, rgba(255, 42, 133, 0.12), transparent 35%),
                  var(--bg);
      color: var(--text);
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      padding: 20px;
    }

    .container { max-width: 1150px; margin: 0 auto; }

    header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      padding: 18px 24px;
      background: var(--card);
      backdrop-filter: blur(16px);
      border: 1px solid var(--border);
      border-radius: 16px;
      margin-bottom: 24px;
      box-shadow: 0 0 30px rgba(0, 240, 255, 0.08);
    }

    .brand { display: flex; align-items: center; gap: 12px; }
    .brand h1 {
      font-size: 1.35rem;
      font-weight: 800;
      background: linear-gradient(90deg, var(--cyan), var(--pink));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .badge {
      font-size: 0.72rem;
      padding: 4px 10px;
      border-radius: 20px;
      background: rgba(0, 255, 136, 0.12);
      color: var(--green);
      border: 1px solid rgba(0, 255, 136, 0.3);
      font-weight: 700;
    }

    .server-bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
    input[type="text"], input[type="password"] {
      background: rgba(7, 10, 22, 0.9);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px 14px;
      border-radius: 10px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.85rem;
      outline: none;
      transition: 0.2s;
    }
    input:focus { border-color: var(--cyan); box-shadow: 0 0 12px rgba(0, 240, 255, 0.25); }

    .btn {
      padding: 10px 18px;
      border-radius: 10px;
      border: none;
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .btn-cyan { background: linear-gradient(135deg, #00f0ff, #0080ff); color: #050811; }
    .btn-cyan:hover { box-shadow: 0 0 18px rgba(0, 240, 255, 0.5); transform: translateY(-1px); }
    .btn-pink { background: linear-gradient(135deg, #ff2a85, #9d00ff); color: #fff; }
    .btn-pink:hover { box-shadow: 0 0 18px rgba(255, 42, 133, 0.5); transform: translateY(-1px); }
    .btn-green { background: rgba(0, 255, 136, 0.16); color: var(--green); border: 1px solid rgba(0, 255, 136, 0.4); }
    .btn-green:hover { background: var(--green); color: #050811; }
    .btn-red { background: rgba(255, 59, 92, 0.16); color: var(--red); border: 1px solid rgba(255, 59, 92, 0.4); }
    .btn-red:hover { background: var(--red); color: #fff; }

    .grid { display: grid; grid-template-columns: 380px 1fr; gap: 24px; }
    @media (max-width: 900px) { .grid { grid-template-columns: 1fr; } }

    .card {
      background: var(--card);
      backdrop-filter: blur(16px);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 22px;
    }
    .card h2 {
      font-size: 1.05rem;
      margin-bottom: 16px;
      color: var(--cyan);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .dropzone {
      border: 2px dashed rgba(0, 240, 255, 0.35);
      border-radius: 14px;
      padding: 28px 16px;
      text-align: center;
      cursor: pointer;
      transition: 0.25s;
      background: rgba(0, 240, 255, 0.03);
      margin-bottom: 14px;
    }
    .dropzone:hover { border-color: var(--pink); background: rgba(255, 42, 133, 0.08); }
    .dropzone p { font-size: 0.9rem; color: var(--text); margin-bottom: 6px; font-weight: 600; }
    .dropzone span { font-size: 0.76rem; color: var(--muted); }

    .form-group { margin-bottom: 14px; }
    .form-group label { display: block; font-size: 0.78rem; color: var(--muted); margin-bottom: 6px; }
    .form-group input { width: 100%; }

    .bot-list { display: flex; flex-direction: column; gap: 12px; }
    .bot-item {
      background: rgba(8, 12, 26, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 15px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }
    .bot-info h3 { font-size: 0.98rem; margin-bottom: 4px; }
    .bot-meta { font-size: 0.76rem; color: var(--muted); font-family: 'JetBrains Mono', monospace; }
    .status-dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; }
    .running { background: var(--green); box-shadow: 0 0 10px var(--green); }
    .stopped { background: var(--red); box-shadow: 0 0 10px var(--red); }
    .bot-actions { display: flex; gap: 8px; flex-wrap: wrap; }

    .terminal {
      background: #04060d;
      border: 1px solid rgba(0, 240, 255, 0.25);
      border-radius: 12px;
      padding: 16px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.8rem;
      color: #a6accd;
      height: 310px;
      overflow-y: auto;
      white-space: pre-wrap;
      line-height: 1.55;
      margin-top: 18px;
    }
    .terminal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 20px;
      font-size: 0.85rem;
      color: var(--pink);
      font-weight: 700;
    }
    .toast {
      position: fixed; bottom: 20px; right: 20px;
      background: #10162f; border: 1px solid var(--cyan);
      color: #fff; padding: 12px 18px; border-radius: 10px;
      font-size: 0.85rem; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      display: none; z-index: 999;
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <div class="brand">
      <h1>⚡ DRETAIN C STORE</h1>
      <span class="badge" id="connStatus">DISCONNECTED</span>
    </div>
    <div class="server-bar">
      <input type="text" id="serverUrl" placeholder="Backend Render URL" size="28">
      <input type="password" id="apiKey" placeholder="Admin Key" size="14">
      <button class="btn btn-cyan" onclick="connectServer()">Connect Node</button>
    </div>
  </header>

  <div class="grid">
    <div class="card">
      <h2>🚀 Deploy New Bot</h2>
      <div class="dropzone" onclick="document.getElementById('botFile').click()">
        <p id="fileName">Click or Drop .ZIP / .PY Bot File</p>
        <span>Auto-extracts ZIP & installs requirements.txt</span>
        <input type="file" id="botFile" accept=".zip,.py" hidden onchange="handleFileSelect(this)">
      </div>
      <div class="form-group">
        <label>Bot Project Name</label>
        <input type="text" id="botName" placeholder="e.g. telegram-ai-bot">
      </div>
      <div class="form-group">
        <label>Main Entry File</label>
        <input type="text" id="entryFile" value="bot.py" placeholder="bot.py">
      </div>
      <button class="btn btn-pink" style="width: 100%; justify-content: center;" onclick="deployBot()">
        ⚡ Upload & Run 24/7
      </button>
    </div>

    <div class="card">
      <h2>
        <span>🤖 Hosted Bots</span>
        <button class="btn btn-cyan" style="padding: 6px 12px; font-size: 0.75rem;" onclick="fetchBots()">↻ Refresh</button>
      </h2>
      <div class="bot-list" id="botList">
        <div style="color: var(--muted); font-size: 0.85rem;">Connect your backend server URL above to manage live bots.</div>
      </div>
      <div class="terminal-header">
        <span id="consoleTitle">📟 LIVE BOT TERMINAL</span>
        <button class="btn btn-red" style="padding: 4px 10px; font-size: 0.72rem;" onclick="stopLogPolling()">Stop Stream</button>
      </div>
      <div class="terminal" id="terminalOutput">Waiting for server connection...</div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  let logInterval = null;
  let activeLogBot = null;

  window.onload = () => {
    const savedUrl = localStorage.getItem('bot_server_url');
    const savedKey = localStorage.getItem('bot_api_key');
    if (savedUrl) document.getElementById('serverUrl').value = savedUrl;
    if (savedKey) document.getElementById('apiKey').value = savedKey;
    if (savedUrl && savedKey) connectServer();
  };

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.innerText = msg;
    t.style.display = 'block';
    setTimeout(() => t.style.display = 'none', 3500);
  }

  function getHeaders() { return { 'X-API-Key': document.getElementById('apiKey').value.trim() }; }
  function getBaseUrl() { return document.getElementById('serverUrl').value.trim().replace(/\/$/, ''); }

  function handleFileSelect(input) {
    if (input.files && input.files[0]) {
      const file = input.files[0];
      document.getElementById('fileName').innerText = "📦 Selected: " + file.name;
      if (!document.getElementById('botName').value) {
        document.getElementById('botName').value = file.name.replace(/\.(zip|py)$/i, '').replace(/[^a-zA-Z0-9_-]/g, '_');
      }
      if (file.name.endsWith('.py')) document.getElementById('entryFile').value = file.name;
    }
  }

  async function connectServer() {
    const url = getBaseUrl();
    const key = document.getElementById('apiKey').value.trim();
    if (!url || !key) return showToast("Enter Backend URL & Key!");
    localStorage.setItem('bot_server_url', url);
    localStorage.setItem('bot_api_key', key);

    try {
      const res = await fetch(`${url}/api/status`, { headers: getHeaders() });
      if (res.ok) {
        document.getElementById('connStatus').innerText = "ONLINE • 24/7";
        document.getElementById('connStatus').style.color = "#00ff88";
        showToast("Connected Successfully!");
        fetchBots();
      } else {
        showToast("Invalid API Key!");
      }
    } catch (e) {
      showToast("Server unreachable!");
    }
  }

  async function deployBot() {
    const url = getBaseUrl();
    const fileInput = document.getElementById('botFile');
    const botName = document.getElementById('botName').value.trim();
    const entryFile = document.getElementById('entryFile').value.trim();
    if (!fileInput.files[0] || !botName || !entryFile) return showToast("Select file & fill details!");

    const formData = new FormData();
    formData.append('file', fileInput.files[0]);
    formData.append('bot_name', botName);
    formData.append('entry_file', entryFile);

    showToast("Uploading & installing dependencies...");
    document.getElementById('terminalOutput').innerText = `[SYSTEM] Uploading & running dependencies...`;

    try {
      const res = await fetch(`${url}/api/deploy`, { method: 'POST', headers: getHeaders(), body: formData });
      const data = await res.json();
      if (res.ok) {
        showToast(data.message);
        fetchBots();
        viewLogs(botName);
      } else {
        showToast("Error: " + data.error);
      }
    } catch (e) {
      showToast("Upload failed!");
    }
  }

  async function fetchBots() {
    const url = getBaseUrl();
    try {
      const res = await fetch(`${url}/api/bots`, { headers: getHeaders() });
      const data = await res.json();
      const list = document.getElementById('botList');
      list.innerHTML = '';
      if (!data.bots || data.bots.length === 0) {
        list.innerHTML = `<div style="color: var(--muted); font-size: 0.85rem;">No bots deployed yet.</div>`;
        return;
      }
      data.bots.forEach(bot => {
        const isRunning = bot.status === 'running';
        list.innerHTML += `
          <div class="bot-item">
            <div class="bot-info">
              <h3><span class="status-dot ${isRunning ? 'running' : 'stopped'}"></span>${bot.name}</h3>
              <div class="bot-meta">Entry: ${bot.entry} | Status: ${bot.status.toUpperCase()}</div>
            </div>
            <div class="bot-actions">
              ${isRunning ? `<button class="btn btn-red" onclick="controlBot('${bot.name}', 'stop')">Stop</button>` : `<button class="btn btn-green" onclick="controlBot('${bot.name}', 'start')">Start</button>`}
              <button class="btn btn-cyan" onclick="viewLogs('${bot.name}')">Logs</button>
              <button class="btn btn-red" onclick="deleteBot('${bot.name}')">Delete</button>
            </div>
          </div>
        `;
      });
    } catch (e) {}
  }

  async function controlBot(name, action) {
    const res = await fetch(`${getBaseUrl()}/api/bots/${name}/${action}`, { method: 'POST', headers: getHeaders() });
    const data = await res.json();
    showToast(data.message || data.error);
    fetchBots();
    if (action === 'start') viewLogs(name);
  }

  async function deleteBot(name) {
    if (!confirm(`Delete ${name}?`)) return;
    await fetch(`${getBaseUrl()}/api/bots/${name}`, { method: 'DELETE', headers: getHeaders() });
    if (activeLogBot === name) stopLogPolling();
    fetchBots();
  }

  function viewLogs(name) {
    activeLogBot = name;
    document.getElementById('consoleTitle').innerText = `📟 LOGS: ${name}`;
    if (logInterval) clearInterval(logInterval);
    const fetchLog = async () => {
      try {
        const res = await fetch(`${getBaseUrl()}/api/bots/${name}/logs`, { headers: getHeaders() });
        const data = await res.json();
        const term = document.getElementById('terminalOutput');
        term.innerText = data.logs || "No logs...";
        term.scrollTop = term.scrollHeight;
      } catch (e) {}
    };
    fetchLog();
    logInterval = setInterval(fetchLog, 2500);
  }

  function stopLogPolling() {
    if (logInterval) clearInterval(logInterval);
    activeLogBot = null;
    document.getElementById('consoleTitle').innerText = `📟 LIVE BOT TERMINAL`;
  }
</script>
</body>
</html>
